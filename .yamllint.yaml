extends: default

ignore: |
  charts/*/templates/
  .schemas/
  .rendered/
  .terraform/

rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  indentation:
    indent-sequences: consistent

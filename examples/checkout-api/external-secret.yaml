# Pulled from the team's own Key Vault through the namespace SecretStore that
# the tenant chart creates. The secret value never touches Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: checkout-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: tenant-kv
  target:
    name: checkout-api
  data:
    - secretKey: PAYMENT_PROVIDER_API_KEY
      remoteRef:
        key: payment-provider-api-key

# Attaches to the shared Gateway. The hostname must be listed in the team's
# tenant.yaml; DNS (external-dns) and TLS (wildcard certificate) are automatic.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout-api
spec:
  parentRefs:
    - name: public
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - checkout.platform.example.co.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: checkout-api
          port: 80

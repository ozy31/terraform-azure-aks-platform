{{- range .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ $.Values.name }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
  annotations:
    # Pods also need the label azure.workload.identity/use: "true".
    azure.workload.identity/client-id: {{ $.Values.azure.workloadClientId | quote }}
    azure.workload.identity/tenant-id: {{ $.Values.azure.tenantId | quote }}
{{- end }}

{{- if and .Values.keyVault .Values.azure.keyVaultUri }}
# Reads the tenant's own Key Vault with the tenant's workload identity.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tenant-kv
  namespace: {{ .Values.name }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ .Values.azure.keyVaultUri | quote }}
      serviceAccountRef:
        name: {{ first .Values.serviceAccounts }}
{{- end }}

apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant
  namespace: {{ .Values.name }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  hard:
    {{- range $k, $v := .Values.quota }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant
  namespace: {{ .Values.name }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        {{- toYaml .Values.limitRange.defaultRequest | nindent 8 }}
      default:
        {{- toYaml .Values.limitRange.default | nindent 8 }}
      max:
        {{- toYaml .Values.limitRange.max | nindent 8 }}

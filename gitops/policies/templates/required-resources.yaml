apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: platformrequiredresources
  annotations:
    description: >-
      Containers must declare CPU and memory requests and a memory limit.
      Node Auto-Provisioning sizes nodes from requests, and quotas count them.
spec:
  crd:
    spec:
      names:
        kind: PlatformRequiredResources
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package platformrequiredresources

        import future.keywords.contains
        import future.keywords.if
        import future.keywords.in

        required := [
          ["requests", "cpu"],
          ["requests", "memory"],
          ["limits", "memory"],
        ]

        violation contains {"msg": msg} if {
          some c in input.review.object.spec.containers
          some field in required
          not c.resources[field[0]][field[1]]
          msg := sprintf("container <%v> must set resources.%v.%v", [c.name, field[0], field[1]])
        }

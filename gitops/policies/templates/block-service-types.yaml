apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: platformblockservicetypes
  annotations:
    description: >-
      Tenants expose traffic through the shared Gateway, not their own Azure
      load balancers or node ports.
spec:
  crd:
    spec:
      names:
        kind: PlatformBlockServiceTypes
      validation:
        openAPIV3Schema:
          type: object
          properties:
            types:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package platformblockservicetypes

        import future.keywords.contains
        import future.keywords.if
        import future.keywords.in

        violation contains {"msg": msg} if {
          input.review.kind.kind == "Service"
          input.review.object.spec.type in input.parameters.types
          msg := sprintf("service type %v is not allowed; publish through an HTTPRoute on the shared Gateway", [input.review.object.spec.type])
        }

apiVersion: v1
kind: Pod
metadata:
  name: latest
  namespace: checkout
spec:
  containers:
    - name: api
      image: acrtest.azurecr.io/checkout/api:latest
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 256Mi}
    - name: worker
      image: acrtest.azurecr.io/checkout/worker
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 256Mi}

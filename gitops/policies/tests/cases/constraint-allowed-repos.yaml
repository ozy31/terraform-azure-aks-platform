# Copy of ../../constraints/constraints.yaml with Flux variables resolved;
# hack/test-policies.sh fails if the two drift.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: PlatformAllowedRepos
metadata:
  name: tenant-allowed-repos
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
    namespaceSelector:
      matchExpressions:
        - key: platform.example.io/tenant
          operator: Exists
  parameters:
    repos:
      - acrtest.azurecr.io/
      - mcr.microsoft.com/

# Copy of ../../constraints/constraints.yaml with Flux variables resolved;
# hack/test-policies.sh fails if the two drift.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: PlatformBlockServiceTypes
metadata:
  name: tenant-block-service-types
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Service]
    namespaceSelector:
      matchExpressions:
        - key: platform.example.io/tenant
          operator: Exists
  parameters:
    types: [LoadBalancer, NodePort]

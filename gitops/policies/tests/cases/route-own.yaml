apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: checkout
spec:
  parentRefs:
    - name: public
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - checkout.platform.example.co.uk
  rules:
    - backendRefs:
        - name: api
          port: 80

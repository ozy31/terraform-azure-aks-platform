apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: cert-manager
  releaseName: cert-manager
  dependsOn:
    - name: gateway-api-crds
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true
    # Workload identity: the pod gets a federated token for the identity that
    # holds DNS Zone Contributor on the zone (terraform/modules/platform-identities).
    podLabels:
      azure.workload.identity/use: "true"
    serviceAccount:
      labels:
        azure.workload.identity/use: "true"
      annotations:
        azure.workload.identity/client-id: ${CERT_MANAGER_CLIENT_ID}
    prometheus:
      servicemonitor:
        enabled: true
    webhook:
      replicaCount: 2
    cainjector:
      replicaCount: 2

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatekeeper
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: gatekeeper-system
  releaseName: gatekeeper
  chart:
    spec:
      chart: gatekeeper
      version: 3.23.1
      sourceRef:
        kind: HelmRepository
        name: gatekeeper
  values:
    replicas: 3
    auditInterval: 60
    constraintViolationsLimit: 50
    # Fail closed: if Gatekeeper is down, tenant changes wait rather than
    # bypassing policy. Platform namespaces are exempted in the Config object.
    validatingWebhookFailurePolicy: Fail
    validatingWebhookTimeoutSeconds: 5
    emitAdmissionEvents: true
    emitAuditEvents: true
    podDisruptionBudget:
      minAvailable: 2

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: external-secrets
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  values:
    installCRDs: true
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
    # Used by the platform ClusterSecretStore. Tenant SecretStores authenticate
    # with the tenant's own service account instead.
    podLabels:
      azure.workload.identity/use: "true"
    serviceAccount:
      name: external-secrets
      labels:
        azure.workload.identity/use: "true"
      annotations:
        azure.workload.identity/client-id: ${EXTERNAL_SECRETS_CLIENT_ID}
    serviceMonitor:
      enabled: true

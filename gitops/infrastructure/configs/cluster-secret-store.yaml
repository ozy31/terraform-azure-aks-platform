# Platform-wide secrets only. Tenants get a namespaced SecretStore bound to
# their own Key Vault and identity (charts/tenant).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-kv
spec:
  # Only platform namespaces may use the platform vault.
  conditions:
    - namespaceSelector:
        matchLabels:
          platform.example.io/managed-by: platform-team
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${PLATFORM_KEY_VAULT_URI}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets

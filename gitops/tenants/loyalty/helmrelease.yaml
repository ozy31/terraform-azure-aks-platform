apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenant-loyalty
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: loyalty
  storageNamespace: flux-system
  # Teams have edit rights in their namespace; drift detection restores the
  # guardrails this chart owns (network policies, quota, mesh policy).
  driftDetection:
    mode: enabled
  releaseName: tenant-loyalty
  chart:
    spec:
      chart: ./charts/tenant
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: platform
  valuesFrom:
    - kind: ConfigMap
      name: tenant-loyalty
      valuesKey: values.yaml
  values:
    azure:
      tenantId: ${AZURE_TENANT_ID}
      workloadClientId: ${TENANT_LOYALTY_CLIENT_ID}
      keyVaultUri: ${TENANT_LOYALTY_KEY_VAULT_URI}
